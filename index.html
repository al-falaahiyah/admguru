<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM GURU DIGITAL - MA AL-FALAAHIYAH</title>

  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1-etXPMxoKR5y7lV9oy3owMOcsd-rbP-A">

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background: #ffffff; 
    }
    iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>

  <iframe id="app-frame" allow="camera; microphone; geolocation; fullscreen; clipboard-write"></iframe>

  <script>
    const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyfNrtZ_eJ_ECiotFv4cD83gW0jdEqg_NJ4mTKrpwJLQ-hqRYdydZeLGMzCISQZN3RR/exec";
    
    function loadIframe() {
      // Mengambil parameter 'page' dari URL browser (Custom Domain)
      const urlParams = new URLSearchParams(window.location.search);
      const page = urlParams.get('page') || 'LandingPage';
      
      // Memasukkan parameter tersebut ke dalam src Iframe
      document.getElementById("app-frame").src = gasBaseUrl + "?page=" + page;
    }

    // Eksekusi saat halaman pertama kali dimuat
    loadIframe();

    // Fitur sinkronisasi: Jika URL di browser berubah (tombol Back/Forward), 
    // iframe akan otomatis menyesuaikan tanpa refresh total.
    window.onpopstate = function() {
      loadIframe();
    };

    /**
     * SINKRONISASI NAVIGASI (PENTING):
     * Script di bawah ini mendengarkan pesan dari dalam Iframe.
     * Jadi, jika di dalam AppScript Anda melakukan navigasi, 
     * URL di Bar Browser Custom Domain akan ikut berubah.
     */
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'navigate') {
        const newUrl = window.location.pathname + '?page=' + event.data.page;
        window.history.pushState({ path: newUrl }, '', newUrl);
        loadIframe();
      }
    });
  </script>
</body>
</html>

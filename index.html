<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM GURU - MA AL-FALAAHIYAH</title>
    <!-- Favicon PNG -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1-etXPMxoKR5y7lV9oy3owMOcsd-rbP-A">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            /* Warna dark theme aplikasi */
        }
        iframe {
            width: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
        /* Loading overlay sementara iframe dimuat */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            color: white;
            font-family: sans-serif;
            z-index: 10;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #10b981;
            /* Warna hijau primary */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Memuat AdmGuru...</p>
    </div>
    <!-- Iframe App -->
    <iframe id="app"
        allow="camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write; display-capture"
        title="EduAdmin Web App"
        sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation">
    </iframe>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // ----------------------------------------------------------------------
            // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT BAPAK!
            // Pastikan URL diakhiri dengan /exec
            // ----------------------------------------------------------------------
            const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyfNrtZ_eJ_ECiotFv4cD83gW0jdEqg_NJ4mTKrpwJLQ-hqRYdydZeLGMzCISQZN3RR/exec";
            // Mengambil Parameter dari URL Custom Domain Bapak 
            // (misalnya: namadomain.com/?page=Login)
            const urlParams = window.location.search;
            // Menggabungkan URL GAS dengan Parameter yang diberikan
            const iframeUrl = gasBaseUrl + urlParams;
            const iframe = document.getElementById("app");
            const loader = document.getElementById("loader");
            // Menghilangkan loading screen saat iframe selesai dimuat
            iframe.onload = function () {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 500);
            };
            // Memuat URL ke dalam Iframe
            iframe.src = iframeUrl;
        });
    </script>
</body>
</html>

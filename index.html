<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM GURU DIGITAL</title>

  <!-- Favicon PNG -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1w-DFd2evl-qmvYz-unFCNpXf9SZEQRXZ">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100dvh;
      border: none;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const base =
        "https://script.google.com/macros/s/AKfycbyfNrtZ_eJ_ECiotFv4cD83gW0jdEqg_NJ4mTKrpwJLQ-hqRYdydZeLGMzCISQZN3RR/exec";

      const isAdmin =
        location.search.includes("admin");

      document.getElementById("app").src =
        isAdmin ? base + "?page=admin" : base;
    });
  </script>
</head>
<body>

<iframe
  id="app"
  allow="camera; microphone; geolocation; fullscreen">
</iframe>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM GURU DIGITAL - MA AL-FALAAHIYAH</title>
  
  <link rel="icon" type="image/png" href="https://googleusercontent.com/profile/picture/0">

  <style>
    /* Menghilangkan scrollbar pada pembungkus utama */
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%;
      overflow: hidden; 
      background-color: #ffffff;
    }
    /* Iframe memenuhi seluruh layar browser */
    iframe { 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>

  <iframe 
    id="app-frame" 
    src="" 
    allow="camera; microphone; geolocation; fullscreen; clipboard-write; payments"
    title="Aplikasi ADM GURU DIGITAL">
  </iframe>

  <script>
    (function() {
      // 1. URL Web App Google Apps Script Anda (PASTIKAN SUDAH BENAR)
      const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyfNrtZ_eJ_ECiotFv4cD83gW0jdEqg_NJ4mTKrpwJLQ-hqRYdydZeLGMzCISQZN3RR/exec";
      
      // 2. Mengambil semua parameter dari URL (misal: ?page=DataSiswa&user=admin)
      const currentQuery = window.location.search;
      
      // 3. Jika tidak ada parameter ?page=, secara default panggil LandingPage
      // Logika ini sinkron dengan fungsi doGet(e) di Kode.gs Anda
      let finalUrl = gasBaseUrl;
      if (currentQuery) {
        finalUrl += currentQuery;
      } else {
        finalUrl += "?page=LandingPage";
      }

      // 4. Masukkan URL hasil olahan ke dalam Iframe
      document.getElementById("app-frame").src = finalUrl;
      
      // 5. Opsional: Sinkronisasi Judul Tab (jika diperlukan)
      console.log("Memuat halaman: " + finalUrl);
    })();
  </script>

</body>
</html>
